<main>
<h1>暗幕影像：配方与实测</h1>
<p>暖金亚麻油画：可见经纬织纹、晕开色团、羽化边缘、层次退远的山、近黑剪影、一个小而亮的锚点。全部图片为 AI 生成样本，非摄影师作品。</p>

<div class="note">
<strong>已知工具缺陷：</strong>内建 <code>image_gen</code> 在所有输出右下角自动压印「AI生成」水印，提示词明确禁止也无效。下列示例图<strong>未做后期移除</strong>，保持工具原始输出以供核验。
</div>

<h2>默认配方：暖金亚麻</h2>
<figure class="single"><img src="skills/dark-canvas/assets/calibrated-ochre-canvas.jpg" alt="暖金亚麻校准生成图"><figcaption>默认配方实测样本：金色天空、低山脊层层退远、近黑树影、一小群飞鸟、织纹可见。</figcaption></figure>

<h2>烟灰单色变体</h2>
<figure class="single"><img src="skills/dark-canvas/assets/calibrated-monochrome.jpg" alt="烟灰单色校准生成图"><figcaption>单色变体：纯黑白无色偏，枯枝与一轮月，织纹为最强线索。</figcaption></figure>

<h2>照片转换：并排对照</h2>
<div class="pair">
<figure><img src="examples/transfer-source.jpg" alt="AI 合成普通照片式输入"><figcaption>输入：自然色、白船屋、木栈桥、红色小船（AI 合成，非真实照片）</figcaption></figure>
<figure><img src="examples/transfer-canvas.jpg" alt="转换后的亚麻油画"><figcaption>输出：重画为暖金亚麻油画。船屋／栈桥／单船位置保留；天空被重绘。</figcaption></figure>
</div>

<h2>同位置切换</h2>
<p>点击切换原图与转换结果，检查屋顶、窗、栈桥与小船的位置。</p>
<button id="toggle" type="button">当前：原图 · 点击看转换</button>
<figure class="single"><img id="compare" src="examples/transfer-source.jpg" alt="原图与转换图切换对照"></figure>

<h2>上一版中性灰配方（仅作对照，非推荐）</h2>
<div class="pair">
<figure><img src="examples/legacy-neutral-recipe.jpg" alt="旧中性灰配方复现"><figcaption>旧默认配方复现：织纹与阴云成立，但偏冷灰、金调缺失。</figcaption></figure>
<figure><img src="skills/dark-canvas/assets/calibrated-neutral.jpg" alt="上一版中性灰校准图"><figcaption>上一版校准图：已被本轮复核判定为少数派色域。</figcaption></figure>
</div>

<script>
let changed=false;
const btn=document.getElementById('toggle');
const img=document.getElementById('compare');
btn.onclick=()=>{
  changed=!changed;
  img.src=changed?'examples/transfer-canvas.jpg':'examples/transfer-source.jpg';
  btn.textContent=changed?'当前：转换 · 点击看原图':'当前：原图 · 点击看转换';
};
</script>
