<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗幕影像 · 参考与材质选择</title><style>body{margin:0;background:#eeeae2;color:#2e2b23;font:16px/1.7 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px 24px}h1{font-size:29px;font-weight:500}h2{font-size:21px;font-weight:500;margin-top:32px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure,article{margin:0}img{width:100%;height:auto;display:block}figcaption,article p{font-size:14px}article[hidden]{display:none}.filters{padding:16px 0;display:flex;flex-wrap:wrap;gap:20px}select{font:inherit;padding:5px 10px;background:#f9f6ee;border:1px solid #a7a093}a{color:#725137}.note{padding:12px 16px;background:#e0dacd;border-left:3px solid #968974}small{display:block;color:#645e52}p{max-width:1000px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.grid,.pair{grid-template-columns:1fr}main{padding:20px 14px}}</style><main><h1>以原照片为底，选择不同表达</h1><p>共同目标是安静、连续的色面和融合的材质。每张分别选择主体处理、基底/旧痕、边缘气氛：不把所有图都变成毛笔插画，也不默认叠加做旧与晕影。已否定的跨主题场景已从当前项目移除。</p><h2>早期已认可的 Creative OS 案例</h2><div class="pair"><figure><img src="./skills/dark-canvas/assets/accepted-landscape.jpg" alt="海岸：含蓄摄影色形、连续色面与薄布面"><figcaption>海岸：含蓄摄影色形、连续色面与薄布面</figcaption></figure><figure><img src="./skills/dark-canvas/assets/accepted-botanical.jpg" alt="植物：自然枝叶、利落色形、轻旧痕与柔和收边"><figcaption>植物：自然枝叶、利落色形、轻旧痕与柔和收边</figcaption></figure></div><h2>素材按表面选择</h2><div class="grid"><figure><img src="./skills/dark-canvas/assets/materials/rough-linen-ao-1k.jpg" alt="细布面：实际亚麻贴图，只借经纬"><figcaption>细布面：实际亚麻贴图，只借经纬</figcaption></figure><figure><img src="./skills/dark-canvas/assets/materials/worn-canvas-guide.png" alt="轻旧痕：AI 生成示意，不是实拍旧布"><figcaption>轻旧痕：AI 生成示意，不是实拍旧布</figcaption></figure><figure><img src="./skills/dark-canvas/assets/materials/distressed-canvas-guide.png" alt="明显磨损：AI 生成示意，不是摄影师原素材"><figcaption>明显磨损：AI 生成示意，不是摄影师原素材</figcaption></figure></div><p class="note">贴图比成图对比强、织纹可显得粗；只借结构，成图密度/强度以作品为准。新做旧片只供选择与形态参考，不能代替最终图生图验收。<a href="./skills/dark-canvas/assets/materials/NOTICE.md">素材来源与用法</a></p><p><a href="./skills/dark-canvas/SKILL.md">技能入口</a> · <a href="./skills/dark-canvas/references/reference-map.md">分组依据</a> · <a href="./examples/validation.md">本轮记录</a></p></main><script></script></html>
